services:
  # Django Backend API
  - type: web
    name: bulk-shipping-backend
    env: python
    plan: free
    rootDir: backend
    branch: dhines_bulk_shipping
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: |
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: bulk-shipping-backend.onrender.com,*.onrender.com
      - key: DB_NAME
        fromDatabase:
          name: bulk-shipping-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: bulk-shipping-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bulk-shipping-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: bulk-shipping-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bulk-shipping-db
          property: port
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-phi-three-66.vercel.app,https://frontend-o94p5b365-dhineshmuthukaruppan-9911s-projects.vercel.app,https://frontend-h31p0mom3-dhineshmuthukaruppan-9911s-projects.vercel.app
      - key: SMARTY_AUTH_ID
        sync: false  # Set this in Render dashboard
      - key: SMARTY_AUTH_TOKEN
        sync: false  # Set this in Render dashboard

  # PostgreSQL Database
  - type: pgsql
    name: bulk-shipping-db
    plan: free
    databaseName: shipping_db
    databaseUser: shipping_user

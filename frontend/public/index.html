<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Initialize theme synchronously before React renders to prevent flicker -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('shipping_pro_theme');
          var validTheme = (theme === 'dark' || theme === 'light') ? theme : 'light';
          
          // Set theme attributes immediately - BEFORE any rendering
          document.documentElement.setAttribute('data-theme', validTheme);
          document.body.setAttribute('data-theme', validTheme);
          document.body.style.colorScheme = validTheme;
          document.body.style.backgroundColor = validTheme === 'dark' ? '#141414' : '#fff';
          document.body.style.color = validTheme === 'dark' ? '#fff' : '#262626';
          
          // Set root element if it exists (might not exist yet, but try anyway)
          var root = document.getElementById('root');
          if (root) {
            root.setAttribute('data-theme', validTheme);
            root.style.backgroundColor = validTheme === 'dark' ? '#141414' : '#fff';
            root.style.color = validTheme === 'dark' ? '#fff' : '#262626';
          }
          
          // Set html element background to match
          document.documentElement.style.backgroundColor = validTheme === 'dark' ? '#141414' : '#fff';
        } catch (e) {
          // Fallback to light theme if localStorage fails
          document.documentElement.setAttribute('data-theme', 'light');
          document.body.setAttribute('data-theme', 'light');
          document.body.style.colorScheme = 'light';
          document.body.style.backgroundColor = '#fff';
          document.body.style.color = '#262626';
        }
      })();
    </script>
    <style>
      /* Disable transitions on initial load to prevent flicker */
      * {
        transition: none !important;
      }
      /* Re-enable transitions after a short delay */
    </style>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
